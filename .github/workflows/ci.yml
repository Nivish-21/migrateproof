name: CI
on: [pull_request, push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: docker info
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:all
      - run: npm run package:smoke
      - run: npm run build
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: node scripts/windows-smoke.mjs
      - run: npm run package:smoke
